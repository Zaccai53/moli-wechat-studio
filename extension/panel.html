<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>墨流排版助手</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header>
    <div><strong>墨流</strong><span id="editorBadge">检测编辑器…</span></div>
    <button id="closeButton" type="button" aria-label="关闭">×</button>
  </header>

  <nav role="tablist">
    <button class="active" data-tab="markdown" type="button">Markdown</button>
    <button data-tab="repost" type="button">转载</button>
  </nav>

  <main>
    <section id="markdownTab" class="tab-panel">
      <div class="row two">
        <label>风格<select id="theme"><option value="clear">澄明蓝</option><option value="zen">赛博禅</option><option value="pulse">数字脉冲</option></select></label>
        <label>节奏<select id="rhythm"><option value="relaxed">舒展</option><option value="compact">紧凑</option><option value="airy">留白</option></select></label>
      </div>
      <label>标题（留空则读取一级标题）<input id="title" type="text" maxlength="64"></label>
      <label>作者<input id="author" type="text" maxlength="8"></label>
      <label>Markdown 正文<textarea id="markdown" spellcheck="false" placeholder="# 标题&#10;&#10;从这里开始写正文…"></textarea></label>
      <label class="file-button">导入 .md / .txt<input id="fileInput" type="file" accept=".md,.markdown,.txt,text/plain,text/markdown"></label>
      <button class="primary" id="applyButton" type="button">排版并写入正文</button>
    </section>

    <section id="repostTab" class="tab-panel" hidden>
      <div class="mode-card">
        <b>公众号原生转载（推荐）</b>
        <p>由微信读取原文并保留图片、出处和授权状态；扩展只负责搜索和添加指定内容。</p>
        <label>公众号文章链接<input id="repostUrl" type="url" placeholder="https://mp.weixin.qq.com/s/…"></label>
        <button id="searchNativeButton" type="button">在公众号转载窗口中搜索</button>
        <div class="capability" id="repostCapability">尚未选择原文</div>
        <div class="subsection-title">增补设置</div>
        <div class="title-options">
          <label><input type="radio" name="titleMode" value="prefix" checked> 标题开头添加“活动推荐 |”</label>
          <label><input type="radio" name="titleMode" value="custom"> 使用自定义标题</label>
        </div>
        <label>自定义标题<input id="customTitle" type="text" maxlength="64" placeholder="选择自定义标题时填写"></label>
        <label>荐语标题<input id="noteTitle" type="text" value="编者荐语" maxlength="10"></label>
        <label>官方荐语（最多 120 字）<textarea id="note" rows="4" maxlength="120"></textarea></label>
        <label class="check"><input id="insertBody" type="checkbox" checked> 有修改权限时，添加来源署名、增补内容和尾图</label>
        <label>正文增补内容<textarea id="bodyNote" rows="5" placeholder="例如：转载说明、活动信息、补充观点……"></textarea></label>
        <div class="row two positions">
          <label><input type="radio" name="nativePosition" value="top" checked> 放在文首</label>
          <label><input type="radio" name="nativePosition" value="bottom"> 放在文末</label>
        </div>
        <label class="file-button tail-image-button">选择结尾图片<input id="tailImageInput" type="file" accept="image/png,image/jpeg,image/gif,image/webp"></label>
        <div class="image-file-status" id="tailImageStatus">尚未选择结尾图片</div>
        <button class="primary" id="applyNativeButton" type="button">应用到原生转载</button>
      </div>

      <div class="mode-card">
        <b>公开正文直导（备用）</b>
        <p>仅在文章无法走公众号原生转载、且你已获得复制修改授权时使用；微信可能拦截自动读取。</p>
        <label class="check"><input id="permission" type="checkbox"> 我已获得作者单独授权，可以复制并修改该文章</label>
        <button id="importButton" type="button">尝试直接读取公开正文</button>
      </div>
    </section>
  </main>

  <footer>
    <button id="saveButton" type="button">保存为草稿</button>
    <button id="publishButton" type="button">进入发表确认</button>
  </footer>
  <div id="status" role="status"></div>
  <script src="panel.js"></script>
</body>
</html>
