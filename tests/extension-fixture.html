<!doctype html>
<html lang="zh-CN">
<body>
  <div id="js_title_main">
    <textarea id="title">原始标题</textarea>
    <div id="js_title_editor_mount"></div>
  </div>
  <input id="author" class="js_author" type="text">
  <textarea id="js_description" class="js_desc"></textarea>
  <input class="js_url" name="source_url" type="text">
  <div id="edui1_iframeholder">
    <div id="ueditor_0"><div class="rich_media_content"><div class="ProseMirror" contenteditable="true"><p>旧内容</p></div></div></div>
  </div>
  <div id="js_reprint_article_tips" style="display:none"><p class="js_content">当前为开放转载文章，不支持修改</p></div>
  <div id="js_reprint_source" style="display:block">
    <input class="js_reprint_recommend_title" type="text">
    <div class="js_reprint_recommend_content" contenteditable="true"></div>
    <span class="js_reprint_biz_nickname">来源公众号</span>
    <span class="js_reprint_author">作者甲</span>
  </div>
  <div onclick="document.querySelector('.repost-menu').style.display='block';window.newContentOpened=(window.newContentOpened||0)+1"><span>新建内容</span></div>
  <div class="repost-menu" style="display:none">
    <div onclick="document.querySelector('.share_article_dialog').style.display='block';window.repostOpened=(window.repostOpened||0)+1"><span>转载文章</span></div>
  </div>
  <div class="dialog_wrp share_article_dialog" style="display:none">
    <input class="js_search_input" type="text">
    <a class="js_search_btn" href="javascript:window.blockedSearchJavascriptUrl=(window.blockedSearchJavascriptUrl||0)+1" onclick="window.searched=(window.searched||0)+1">搜索</a>
  </div>
  <span id="js_submit"><button type="button" onclick="window.saved=(window.saved||0)+1">保存为草稿</button></span>
  <span id="js_send"><button type="button" onclick="window.published=(window.published||0)+1">发表</button></span>
</body>
</html>
